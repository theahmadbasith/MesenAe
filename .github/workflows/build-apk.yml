name: Build Android App (APK & AAB)

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

jobs:
  build:
    name: Build Android Artifacts
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      # 1. Checkout Repository
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # 2. Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      # 3. Install dependencies
      # We use --legacy-peer-deps to avoid peer dependency conflicts during clean install
      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      # 4. Setup Environment Variables (.env)
      # If secrets.ENV_FILE is provided, write it directly to .env. Otherwise, fallback to .env.example.
      - name: Setup Environment Variables
        env:
          ENV_FILE_CONTENT: ${{ secrets.ENV_FILE }}
        run: |
          if [ -n "$ENV_FILE_CONTENT" ]; then
            printf "%s" "$ENV_FILE_CONTENT" > .env
          else
            cp .env.example .env
          fi

      # 5. Decode Release Keystore
      # If secrets.RELEASE_KEYSTORE_BASE64 is provided, decode it.
      - name: Decode and verify Release Keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "WARNING: RELEASE_KEYSTORE_BASE64 secret is missing. Falling back to default local release.keystore."
          else
            node -e "const fs = require('fs'); fs.writeFileSync('my-upload-key.jks', Buffer.from(process.env.RELEASE_KEYSTORE_BASE64, 'base64'));"
            ls -l my-upload-key.jks
            
            # Check file size (portable for Linux/macOS)
            size=$(stat -c%s my-upload-key.jks 2>/dev/null || stat -f%z my-upload-key.jks)
            echo "Keystore size: $size bytes"
            if [ -z "$size" ] || [ "$size" -lt 1024 ]; then
              echo "ERROR: Keystore file seems too small or corrupted" >&2
              exit 1
            fi
          fi

      # 6. Build Web Project (bundles HTML, CSS, JS inside /dist)
      - name: Build Web Application
        run: npm run build

      # 7. Set up Java JDK 21 (Required by Gradle and modern Android SDKs)
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      # 8. Sync Web Assets with Capacitor Android Platform
      - name: Capacitor Sync
        run: npx cap sync android

      # 9. Setup Gradle using the official modern action (handles automatic caching)
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 10. Build Android release APK and release AAB (bundle) via Gradle
      - name: Build Android App (APK & AAB)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon

      # 12. Upload Release APKs (Signed, including splits and universal)
      - name: Upload Release APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MesenAe-Release-APKs
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 7

      # 13. Upload Release AAB (Android App Bundle - Signed)
      - name: Upload Release AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MesenAe-Release-AAB
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 7
